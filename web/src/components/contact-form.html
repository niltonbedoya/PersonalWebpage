<!-- Contact form fragment for the Showcase Hub & Spoke frontend.
     HTML fragment: no <html> or <body> tags. All code ASCII-only. -->
<form id="contact-form" class="form">
  <div class="form-group">
    <label for="contact-name">Name</label>
    <input type="text" id="contact-name" name="name" required maxlength="200">
  </div>
  <div class="form-group">
    <label for="contact-email">Email</label>
    <input type="email" id="contact-email" name="email" required maxlength="200">
  </div>
  <div class="form-group">
    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" required rows="5" maxlength="2000"></textarea>
  </div>
  <!-- Honeypot: invisible to users, filled by bots. Any value blocks submission. -->
  <input type="hidden" name="website" tabindex="-1" autocomplete="off" value="">
  <button type="submit" class="btn btn-primary">Send message</button>
  <div id="contact-result"></div>
</form>
