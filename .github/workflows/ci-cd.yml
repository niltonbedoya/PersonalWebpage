name: CI/CD — Showcase Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # TEST — corre la suite completa (395 tests, offline, sin red)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify git working tree is clean (no uncommitted changes)
        run: |
          git diff --quiet || { echo "ERROR: working tree has uncommitted changes"; git status --short; exit 1; }

      - name: Build RAG corpus index
        run: |
          python -c "from backend.app.db.indexer import index_corpus; index_corpus()"

      - name: Run full test suite
        run: |
          python -m pytest backend/tests/ tests/ -q

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DEPLOY — solo en push a main y solo si TEST pasó
  # Despliega en tu Mac Mini (Linux Mint) mediante runner self-hosted de GitHub
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy:
    needs: test
    runs-on: [self-hosted, linux]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run deploy script on Mac Mini
        run: |
          bash deploy/deploy.sh
